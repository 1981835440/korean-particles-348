<!DOCTYPE html>

<head>

<title>韩语助词 348 题 · 手机点选练习</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c1f24;--sub:#6b7280;--line:#e3e6ea;--blue:#2f5aa0;--red:#c0392b;--green:#1f9254;--chip:#eef2f8;--chipink:#243b62}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "PingFang SC","Microsoft YaHei","Malgun Gothic",system-ui,sans-serif}
.top{position:sticky;top:0;z-index:6;background:var(--card);border-bottom:1px solid var(--line);padding:9px 12px}
.row{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}
.stat{font-size:13px;color:var(--sub);white-space:nowrap}
.stat2{font-size:12px;color:var(--sub)}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 270px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.sec{font-size:12px;color:var(--blue);background:var(--chip);display:inline-block;padding:3px 8px;border-radius:20px;margin-bottom:10px}
.sent{font-size:21px;line-height:2.05;letter-spacing:.2px}
.g{font-size:12px;color:var(--sub)}
.slot{display:inline-block;min-width:76px;padding:0 6px;border-bottom:2px solid var(--ink);text-align:center;font-weight:700;color:var(--blue)}
.slot.ok{border-color:var(--green);color:var(--green)}
.slot.no{border-color:var(--red);color:var(--red);text-decoration:line-through}
.fb{margin-top:14px;font-size:14px;border-radius:10px;padding:10px 12px}
.fb.ok{background:#eaf6ef;color:#156b3f}
.fb.no{background:#fdeeec;color:#96281b}
.fb .k{font-weight:700}
.fb .tr{color:var(--sub);margin-top:4px;font-size:13px}
.fb .ex{font-size:13px;line-height:1.6;margin-top:7px;padding:6px 8px;border-radius:7px;background:rgba(255,255,255,.6)}
.fb .ex b{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;margin-right:6px;background:#2f5aa0;color:#fff;font-weight:600;vertical-align:1px}
.fb.no .ex b{background:#96281b}
.pad{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:8px 10px 12px;box-shadow:0 -6px 18px rgba(0,0,0,.06);max-height:50vh;overflow:auto;z-index:7}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.tab{flex:0 0 auto;font-size:12px;padding:5px 10px;border-radius:20px;background:var(--chip);color:var(--chipink);cursor:pointer}
.tab.on{background:var(--blue);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:18px;padding:9px 13px;border-radius:10px;background:var(--chip);color:var(--chipink);border:1px solid #dfe6f0;cursor:pointer;user-select:none}
.chip:active{transform:translateY(1px);background:#dde6f5}
.act{margin-top:9px;display:flex;gap:8px}
.btn{flex:1;font-size:16px;padding:12px 8px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
.nav{display:flex;gap:8px;margin:10px 0 0}
.mini{font-size:13px;padding:8px 11px;border-radius:8px;background:#fff;border:1px solid var(--line);cursor:pointer;color:#333;flex:1}
.mini.warn{color:var(--red)}
.hintline{font-size:12px;color:var(--sub);margin:8px 2px 0;min-height:16px}
h1{font-size:19px;margin:2px 0 8px}
p.hint{font-size:13px;color:var(--sub);margin:4px 0 12px}
.list{font-size:14px}
.list div{padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.mask.on{display:flex}
.modal{background:#fff;border-radius:14px;max-width:660px;width:100%;max-height:82vh;overflow:auto;padding:16px}
textarea{width:100%;height:200px;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px}
</style>
</head>

<script>

var DATA = [{"n":1,"s":"저（我）____ 학생（学生）입니다。","a":"는","x":[],"e":"介绍身份，主语是已知话题 → 는；저 无收音。","t":"我是学生。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":2,"s":"제（我的）이름（名字）____ 김민수입니다。","a":"은","x":[],"e":"话题 + 이름 有收音ㅁ → 은。","t":"我叫金民秀。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":3,"s":"우리（我们的）어머니（母亲）____ 요리（做菜）를 정말（真的） 잘하세요（做得好）。","a":"는","x":["가"],"e":"家人是已知话题 → 는（어머니 无收音）；答 가 也可，但话题句更自然。","t":"我妈妈做饭真拿手。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":4,"s":"이（这个）제품（产品）____ 요즘（最近） 인기가 많아요。","a":"은","x":[],"e":"评价手头话题 → 은；제품 有收音ㅂ。","t":"这个产品最近人气很旺。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":5,"s":"제（我的）방（房间）____ 창문（窗户）____ 두 개（两个） 있어요。","a":"은／이","x":[],"e":"大主语（场所话题）用은（방 有收音ㅁ）；小主语창문 有收音ㅁ，新信息用이。","t":"我们房间有两扇窗户。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":6,"s":"교실（教室）____ 책상（课桌）____ 스무（二十） 벌（二十套） 있어요。","a":"은／이","x":[],"e":"场所话题用은（교실 有收音ㄹ）；存在的主体用이（책상 有收音ㅈ）。","t":"教室里有二十套课桌。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":7,"s":"오늘（今天）날씨（天气）____ 좋네요。","a":"가","x":[],"e":"感叹眼前的新情况，客观描述用가（날씨 无收音）。","t":"今天天气真好啊。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":8,"s":"밖（外面）에서 비（雨）____ 내리（下）고 있어요。","a":"가","x":[],"e":"自然现象初次陈述用가（비 无收音）。","t":"外面正下着雨。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":9,"s":"방（房间） 안（里面）에 고양이（猫）____ 한 마리（一只） 있어요。","a":"가","x":[],"e":"存在句中新出现的事物用가；量词한 마리前面不加格助词。","t":"房间里有一只猫。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":10,"s":"누구（谁）____ 이 소포（包裹）를 가져갔어요？","a":"가","x":[],"e":"疑问代词作未知主语只能用가，绝不能写누구는。","t":"谁把这个包裹拿走了？","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":11,"s":"—누가 창문（窗户）을 열었어요？　—저（我）____ 열었어요。","a":"가","x":[],"e":"回答“谁”、强调主语本身 → 가。","t":"——谁开的窗？——是我开的。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":12,"s":"물（水）____ 없으면 사람（人）____ 살（活） 수 없어요。","a":"이／이","x":[],"e":"条件从句主语用主格；물 有收音ㄹ→이，사람 有收音ㅁ→이。","t":"没有水人就活不了。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":13,"s":"이 문장（句子）____ 뜻（意思）____ 모르（不知道）겠어요。","a":"은／이","x":[],"e":"话题用은（문장 有收音ㅇ）；新信息“뜻”有收音ㅅ → 이。","t":"这个句子的意思我不明白。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":14,"s":"커피（咖啡）____ 좋아하지만 차（茶）____ 싫어해요。","a":"는／는","x":[],"e":"前后对照表“这个…那个…”的对比，都用는（两词皆无收音）。","t":"他喜欢咖啡，但不喜欢茶。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":15,"s":"형（哥哥）____ 키（个儿）가 크（大）고 동생（弟弟）____ 성격（性格）이 좋（好）아요。","a":"은／은","x":[],"e":"分别陈述两人：형 有收音ㅁ → 은，동생 有收音ㅇ → 은。","t":"哥哥个儿高，弟弟性格好。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":16,"s":"한국（韩国）____ 인구（人口）____ 점점（渐渐） 줄（减）고 있어요。","a":"은／가","x":[],"e":"话题한국 有收音ㄱ → 은；新信息인구 无收音 → 가。","t":"韩国人口在不断减少。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":17,"s":"제（我的）가 한 말（话）____ 사실이 아니에요。","a":"은","x":[],"e":"从句主语用가（제가），主句把“말”放话题位 → 은（말 有收音ㄹ）。","t":"我说的话不是事实。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":18,"s":"제（我的）친구（朋友）____ 캐나다（加拿大）에서 태어났어요。","a":"는","x":["가"],"e":"陈述已知人物的情况 → 는（친구 无收音）。","t":"我朋友出生在加拿大。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":19,"s":"새（新）로 산（新买的）휴대폰（手机）____ 카메라（摄像头）가 정말（真的） 좋（好）아요。","a":"은","x":[],"e":"大主语话题用은（휴대폰 有收音ㄴ），小主语카메라用가。","t":"新买的手机摄像头特别好。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":20,"s":"우리나라（我们国家）____ 여름（夏天）은 덥고（热） 겨울（冬天）____ 추워요。","a":"는／은","x":[],"e":"话题우리나라 无收音 → 는；季节对比여름은…겨울은…（겨울 有收音ㄹ）。","t":"我们国家夏天热、冬天冷。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":21,"s":"시간（时间）____ 정말（真的） 빨리（快地） 지나가요（流逝）。","a":"이","x":[],"e":"感叹时间流逝，新信息用主格；시간 有收音ㄴ → 이。","t":"时间过得真快啊。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":22,"s":"그 문제（问题）____ 생각만큼 쉽（容易）지 않아요。","a":"는","x":[],"e":"对已知对象作评价 → 는（문제 无收音）。","t":"那道题不像想象的那么容易。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":23,"s":"제（我的）고향（故乡）____ 산（山）이 많고 공기（空气）____ 좋（好）아요。","a":"은／가","x":[],"e":"话题고향 有收音ㅇ → 은；并列小主语공기 无收音 → 가。","t":"我故乡山多、空气也好。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":24,"s":"이 중（其中）에는 제（我的）가 좋아하는 영화（电影）____ 세 편（三部） 있어요。","a":"가","x":[],"e":"“…에는 …이/가 있다”结构中存在的主体用가（영화 无收音）。","t":"其中有三部我喜欢的电影。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":25,"s":"그분（那位）____ 어제（昨天） 못（没能） 오셨대요（来过）。","a":"은","x":[],"e":"转述已知人物的情况 → 은（그분 有收音ㄴ）。","t":"听说他昨天没能来。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":26,"s":"사람（人）____ 생각（想法）____ 다 달라요。","a":"은／이","x":[],"e":"泛指话题“人”有收音ㅁ→은；其下新信息생각 有收音ㄱ→이。","t":"每个人想法都不一样。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"","us":""},{"n":27,"s":"저（我）는 벌레（虫子）____ 무서워요。","a":"가","x":[],"e":"무섭다 的主体用이/가；벌레 无收音→가。","t":"我怕虫子。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"좋다·싫다·무섭다·부럽다·그립다 这类心理形容词，主体一律用이/가，不能写成벌레를 무서워요（那样意思就变成“害怕地对待虫子”）。","us":"日常高频：추위를 타다（怕冷）、겁을 먹다（害怕）这类固定搭配用를，和心理形容词＋이/가 要分清（저는 추위를 많이 타요）。"},{"n":28,"s":"그건 내（我）____ 할게요。","a":"가","x":[],"e":"나＋가 缩合成 내가，空格只补가。","t":"那个我来做。","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"缩合主格：나＋가→내가、저＋가→제가、너＋가→네가（读［니가］）、누구＋가→누가。写成너가／저가 都算错。","us":"口语答应帮忙最爱说：제가 할게요／내가 할게요。"},{"n":29,"s":"와, 이 옷（衣服）____ 정말（真的） 예쁘네요！","a":"이","x":[],"e":"感叹眼前新看到的东西，主体用이（옷 有收音ㅂ）。","t":"哇，这件衣服真好看！","sec":"专题一 · 이/가 与 은/는（主格 · 主题）","sp":"-네요 感叹句里，新发现的主体用이/가；若说이 옷은 예쁘네요 就变成“这件（跟别的比）好看”，语气不同。","us":"逛街常用：이거（这个） 예쁘네요／좋네요，省略助词也自然。"},{"n":30,"s":"저（我）는 오늘（今天） 저녁（晚饭）____ 아직 먹지 않았어요。","a":"을","x":[],"e":"저녁 有收音ㄱ → 을。","t":"我今天晚饭还没吃。","sec":"专题二 · 을/를（宾格）","sp":"","us":""},{"n":31,"s":"제발（千万）저（我）____ 좀 도와주세요（请帮忙）。","a":"를","x":[],"e":"저 固定接 를（저를），不写 저을。","t":"请一定帮帮我。","sec":"专题二 · 을/를（宾格）","sp":"","us":""},{"n":32,"s":"매일（每天）물（水）____ 여덟（八） 잔（八杯） 마셔요（喝）。","a":"을","x":[],"e":"물 有收音ㄹ，仍接을（물을）；ㄹ 脱落只发生在(으)로（물로）。","t":"我每天喝八杯水。","sec":"专题二 · 을/를（宾格）","sp":"","us":""},{"n":33,"s":"빵（面包）____ 먹고 우유（牛奶）____ 마셨어요。","a":"을／를","x":[],"e":"빵 有收音ㅂ → 을；우유 无收音 → 를。","t":"吃了面包，喝了牛奶。","sec":"专题二 · 을/를（宾格）","sp":"","us":""},{"n":34,"s":"어제（昨天） 시장（市场）에서 과일（水果）____ 몇（几） 개（几个） 샀어요。","a":"을","x":[],"e":"과일 有收音ㄹ→을（과일을）。","t":"昨天在市场买了几样水果。","sec":"专题二 · 을/를（宾格）","sp":"","us":""},{"n":35,"s":"계획（计划）____ 다시（再） 세워요（制定）。","a":"을","x":[],"e":"계획 有收音ㄹ→을（계획을 세우다 是固定搭配）。","t":"重新制定计划。","sec":"专题二 · 을/를（宾格）","sp":"","us":""},{"n":36,"s":"집（房子）에 도착하면（一到就） 손（手）____ 먼저 씻어요。","a":"을","x":[],"e":"손 有收音ㄴ → 을。","t":"一到家就先 var SECS = [{"sec":"专题一 · 이/가 与 은/는（主格 · 主题）","tip":"本专题只在 이 · 가 · 은 · 는 中选填。① 名词有收音（末音是辅音）→ 이／은；无收音（末音是元音）→ 가／는。② 说“谁／什么”（新信息、存在句、疑问词主语、客观现象、强调主语）用 이／가；把已知事物摆上话题位来谈（介绍、对比、评价）用 은／는。","from":1,"count":29},{"sec":"专题二 · 을/를（宾格）","tip":"本专题只在 을 · 를 中选填。名词有收音 → 을，无收音 → 를。注意：以 ㄹ 收音结尾的名词照常接 을（물을·과일을·계획을·사실을），ㄹ 脱落只发生在 (으)로（물로·서울로）；저 无收音，固定写 저를。","from":30,"count":19},{"sec":"专题三 · 의（属格“的”）","tip":"本专题只填 의。의 连接两个名词，表所属、内容、同位（A의 B＝A的B）；口语里“우리 엄마 음식”这类亲属领属常省略 의，但书面填空要写。의 只有一种形式，没有变体。","from":49,"count":17},{"sec":"专题四 · 에（存在处所 · 时点 · 对象 · 归着点）","tip":"本专题只填 에。① 静态存在/附着（있다·없다·살다·걸리다·넣다）＋处所→ 에；② 时间点（几点·几天·星期·年份）→ 에；③“对／向某对象”（관심·기대·축하·놀라다）→ 에。动作进行的场所要用 에서（见专题五），目的地要用 (으)로 也可用 에。","from":66,"count":17},{"sec":"专题五 · 에서（动作场所 · 起点 · 范围）","tip":"本专题只填 에서。① 动作“在……进行”（먹다·공부하다·상담하다·열리다）→ 에서；② 空间/来源起点（오다·나오다·분리하다）常与 까지 呼应 → 에서；③“在……之中（范围、最高级）”→ 에서。静态存在（있다/없다/살다）不能用 에서，要用 에。","from":83,"count":17},{"sec":"专题六 · (으)로 / 로서 / 로써（方向 · 手段 · 材料 · 身份 · 依据 · 原因 · 变化）","tip":"本专题填 로·으로·로서·로써·으로서는。变形：名词有收音（除ㄹ）→ 으로／으로서·으로써；无收音或以 ㄹ 收音结尾 → 로／로서·로써。意思分清：①方向（오른쪽）②手段工具·材料（연필）③身份（학생으로서）④依据·凭借 ⑤原因（사고로）⑥变化·归着（박물관으로）。","from":100,"count":21},{"sec":"专题七 · 에게 · 한테 · 께 · 께서 · 에게서（对象 · 来源 · 敬语）","tip":"本专题填 에게·한테·께·께서·에게서·한테서。① 人或动物作接受对象：에게（书面）＝한테（口语）；② 对长辈尊长用 께；③ 长辈作主语用께서（=가 的敬语）；④ 从某人那里得到/听到用 에게서·한테서；⑤ 机构、无生命事物用 에。","from":121,"count":19},{"sec":"专题八 · 와 / 과 · 랑 / 이랑 · 나 / 이나（并列 · 共同 · 选择）","tip":"本专题填 와·과·랑·이랑·나·이나。变形统一：名词有收音 → 과·이랑·이나；无收音 → 와·랑·나。意思分清：①“和”并列·共同做某事（와/과，口语랑/이랑）；②“或者”二选一（나/이나）。","from":140,"count":19},{"sec":"专题九 · 도 · 마저 · 조차 · 까지（也 · 甚至 · 连…都 · 到…为止）","tip":"本专题填 도·마저·조차·까지。变形：四者都只有一种形式，接在名词后不加中间元音。语义：도“也”；조차“连（意想不到的）都…”；마저“连（最后一样）也…”（多带消极语气）；까지“到…为止／甚至到…”。它们与否定呼应时最常见。","from":159,"count":21},{"sec":"专题十 · 만 / 뿐（只 · 仅 · 不过是）","tip":"本专题填 만·뿐。만“只、仅”接名词后（限定范围）；뿐“只不过、而已”常用于“~일 뿐이다／~는 것뿐이다”。区分：만＝别的都不包括；뿐＝语气上是“仅此而已”，前面多有动词名词化（하는 것뿐）。","from":180,"count":19},{"sec":"专题十一 · 부터 · 까지 · 마다 · 여 · 만에 · 정도 · 째 · 대로","tip":"本专题填这几个“副格助词”。① 부터~까지“从…到…”（时间·空间的起终）；② 마다“每逢、每个”（接在表时间或名词后，前面不再加가/은）；③ 여 接在数词＋量词后表“有余”（닷새여＝五天多）；④ 만에“隔了多久之后”（사흘 만에）；⑤ 정도“左右、光景”；⑥ 째接在数词后表“第…”（세 번째）；⑦ 대로“按照”（接在名词或冠形词形后）。","from":199,"count":21},{"sec":"专题十二 · 보다 · 만큼 · 처럼 · 같이 · 대로（比较 · 程度 · 比喻）","tip":"本专题填 보다·만큼·처럼·같이（대로）。① 보다“比”（A이 B보다 …）；② 만큼“与…相当／到那种程度”，也常接在 ㄴ/은 形后（노력한 만큼）；③ 처럼·같이“像…一样”，같이 更口语，처럼 后常跟 같은；④ 대로“照…那样”（本专题只考少数几题）。","from":220,"count":23},{"sec":"专题十三 · 때문에 · 탓에 · (으)로 인해 · 덕분에（原因 · 理由）","tip":"本专题填这类“表原因”的助词结构。① 때문에＝因为（中性，最常用）；② 탓에＝因…的过错（负面归咎）；③ (으)로 인해(서)＝由于…（书面，ㄹ收音或无收音→로，其他收音→으로）；④ 덕분에＝多亏…（正面恩惠，后面不再加别的助词）。","from":243,"count":17},{"sec":"专题十四 · 惯用合成助词（에 따라 · 에 대해 · 을 통해 · 로부터 · 를 제외하고 等）","tip":"本专题填“名词＋固定助词框架”。① -에 따라(서) 随着；② -에 대해(서) 关于；③ -을/를 통해(서) 通过（无收音→를，有收音→을）；④ -(으)로부터 从（抽象来源）；⑤ -을/를 제외하고 除…外；⑥ -을/를 막론하고 不论；⑦ -에 한해(서) 限于；⑧ -에 비해(서) 与…相比；⑨ -에 못지않다 不亚于；⑩ -를 중심으로 以…为中心；⑪ -에 힘입어 得益于；⑫ -에 이어 继…之后；⑬ -을/를 비롯한 包括…在内的；⑭ -는/은 물론 …也。","from":260,"count":17},{"sec":"专题十五 · 方位词与场所框架（… 위에 · …에서 · …의 …）","tip":"本专题填接在方位词（위·앞·옆·뒤·안·밖·가운데·맞은편·사이·끝）后的助词。① 静态存在（있다·걸리다·놓여 있다）→ 方位词＋에；② 有意识的动作（만나다·넘어지다·보다·말하다）→ 方位词＋에서；③ “A 和 B 之间／A 的前面”表所属 → A＋의＋方位词。","from":277,"count":21},{"sec":"混合练习（一）· 全部助词","tip":"以下不再限定助词范围：请填入任意合适的助词（一个空格只填一个助词，两个空格按顺序填）。","from":298,"count":51}];

function norm(s) { return String(s || '').replace(/[\s／/·，,、]/g, ''); }

function splitAns(t, n) {
  if (n <= 1) return [t];
  if (!t) return new Array(n).fill('');
  var out = [], rest = t;
  for (var i = 0; i < n - 1 && rest; i++) {

    }
    if (!put) { out.push(rest); rest = ''; break; }
  }
  out.push(rest);

  document.getElementById('prg').style.width = (dn / DATA.length * 100) + '%';
  document.getElementById('stat').textContent = dn + '/' + DATA.length;
  document.getElementById('stat2').textContent = '对 ' + rg + ' · 错 ' + (dn - rg) + ' · 正确率 ' + (dn ? Math.round(rg / dn * 100) + '%' : '—') + (S.mode === 'wrong' ? ' · 错题模式(' + (S.i + 1) + '/' + S.queue.length + ')' : ' · 第 ' + qNo() + ' 题');
}
function addChip(c) { cur += (cur ? ' ' : '') + c; render(); }
function del() { cur = cur.replace(/\s*\S+$/, ''); render(); }
function clr() { cur = ''; render(); }
function submit() {
  var d = dNow();
  if (!norm(cur)) { flash('先点一个助词再提交'); return; }
  S.ans[d.n] = cur; S.done[d.n] = isAns(d.n - 1, cur) ? 1 : 0;
  if (S.done[d.n]) delete S.wrong[d.n]; else S.wrong[d.n] = 1;
  save(); render(); setTimeout(next, 850);
}
function answerThis() {
  var d = dNow();
  if (!done(d.n)) { S.done[d.n] = 0; S.wrong[d.n] = 1; }
  S.ans[d.n] = d.a; cur = d.a; save(); render();
}
function next() {
  var max = S.mode === 'wrong' ? S.queue.length : DATA.length;
  if (S.i < max - 1) S.i++;
  save(); cur = S.ans[qNo()] || ''; render();
}
function go(k) {
  var max = S.mode === 'wrong' ? S.queue.length : DATA.length;
  var i = S.i + k; if (i < 0) i = 0; if (i >= max) return;
  S.i = i; save(); cur = S.ans[qNo()] || ''; render();
}
function jumpNext() {
  var pool = S.mode === 'wrong' ? S.queue : DATA.map(function (d) { return d.n; });
  for (var i = 0; i < pool.length; i++) if (!done(pool[i])) { S.i = i; break; }
  save(); cur = S.ans[qNo()] || ''; render();
}
function flash(t) { var e = document.getElementById('hintline'); e.textContent = t; }
function tabSet(g) {
  grp = g;
  document.getElementById('chips').innerHTML = CHIPS[g].k.map(function (k) { return '<div class="chip" data-k="' + k + '">' + k + '</div>'; }).join('');
  var t = document.querySelectorAll('.tab'); for (var i = 0; i < t.length; i++) t[i].className = 'tab' + (i === g ? ' on' : '');
}
function openMenu() {
  var dn = Object.keys(S.done).length, rg = Object.keys(S.done).filter(function (k) { return S.done[k] === 1; }).length;
  var list = SECS.map(function (s) {
    var ok = 0, bad = 0;
    for (var i = s.from; i < s.from + s.count; i++) { if (S.done[i] === 1) ok++; else if (S.done[i] === 0) bad++; }
    return '<div onclick="jumpTo(' + s.from + ')">' + s.sec.replace(/（.*?）/, '').trim() + '<b style="float:right;color:#2f5aa0">' + ok + '/' + s.count + ' 对</b></div>';
  }).join('');
  modal('<h1>目录 · 进度 · 工具</h1><p class="hint">已做 ' + dn + '/' + DATA.length + '，正确 ' + rg + '（' + (dn ? Math.round(rg / dn * 100) : 0) + '%）；错题 ' + Object.keys(S.wrong).length + ' 道。点专题可跳转。</p><div class="list">' + list + '</div>' +
    '<div class="foot"><button class="mini" onclick="startWrong()">只重做错题（' + Object.keys(S.wrong).length + '）</button><button class="mini" onclick="backAll()">全部顺序练</button><button class="mini" onclick="exportAns()">导出我的答案 → 发给千问办公批改</button><button class="mini warn" onclick="resetAll()">清空进度</button><button class="mini" onclick="closeM()">关闭</button></div>');
}
function jumpTo(n) { S.mode = 'all'; S.i = n - 1; save(); closeM(); cur = S.ans[n] || ''; render(); }
function startWrong() {
  var w = Object.keys(S.wrong).map(Number).sort(function (a, b) { return a - b; });
  if (!w.length) { alert('还没有错题，先做几题'); return; }
  S.queue = w; S.i = 0; S.mode = 'wrong'; save(); closeM(); cur = S.ans[w[0]] || ''; render();
}
function backAll() { S.mode = 'all'; S.i = 0; save(); closeM(); cur = S.ans[qNo()] || ''; render(); }
function resetAll() { if (!confirm('确定清空全部作答记录？')) return; S = { ans: {}, done: {}, wrong: {}, i: 0, mode: 'all', queue: [] }; save(); cur = ''; closeM(); render(); }
function exportAns() {
  var lines = DATA.map(function (d) { var v = S.ans[d.n] || ''; var st = done(d.n) ? (isRight(d.n) ? '✓' : '✗(正确:' + d.a + ')') : '·'; return d.n + ' ' + v + ' ' + st; }).join('\n');
  modal('<h1>我的作答</h1><p class="hint">复制后发给千问办公，我按题号批改并只讲错题（✓＝网页判对，✗＝网页判错，·＝未做）。</p><textarea id="ta" readonly>' + lines.replace(/</g, '&lt;') + '</textarea><div class="foot"><button class="btn pri" onclick="cp()">复制全部</button><button class="mini" onclick="closeM()">关闭</button></div>');
}
function cp() {
  var t = document.getElementById('ta'); t.focus(); t.select();
  var txt = t.value, done2 = function () { alert('已复制，去聊天框粘贴即可'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done2, function () { try { document.execCommand('copy'); done2(); } catch (e) { alert('长按文本框全选复制'); } });
  else { try { document.execCommand('copy'); done2(); } catch (e) { alert('长按文本框全选复制'); } }
}
function modal(h) { document.getElementById('modal').innerHTML = h; document.getElementById('mask').classList.add('on'); }
function closeM() { document.getElementById('mask').classList.remove('on'); }
document.getElementById('mask').addEventListener('click', function (e) { if (e.target === this) closeM(); });
document.getElementById('chips').addEventListener('click', function (e) { var k = e.target.getAttribute('data-k'); if (k) addChip(k); });
document.getElementById('tabs').innerHTML = CHIPS.map(function (c, i) { return '<div class="tab' + (i === 0 ? ' on' : '') + '" data-g="' + i + '">' + c.g + '</div>'; }).join('');
document.getElementById('tabs').addEventListener('click', function (e) { var g = e.target.getAttribute('data-g'); if (g !== null) tabSet(+g); });
document.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); if (e.key === 'ArrowRight') next(); if (e.key === 'ArrowLeft') go(-1); });
tabSet(0);
cur = S.ans[qNo()] || '';
render();

</script>
</body>
</html>
